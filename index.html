<!doctype html>
<html lang="sk" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Elm FA SPA</title>
    <link rel="icon" href="icon.png" type="image/x-icon">
    <meta name="theme-color" content="#0b0f14">
    <style>
      :root {
        --bg-dark: #0b0f14;
        --fg-dark: #e5e7eb;

        --bg-light: #f9fafb;
        --fg-light: #111827;
      }

      html[data-theme="dark"] body {
        background-color: var(--bg-dark);
        color: var(--fg-dark);
      }

      html[data-theme="light"] body {
        background-color: var(--bg-light);
        color: var(--fg-light);
      }

      body {
        margin: 0;
        padding: 0;
      }

      .responsive-block {
        margin-top: 40px; /* на компьютере */
      }

      @media (max-width: 768px) {
        .responsive-block {
          margin-top: 20px; /* на телефоне */
        }
      }
    </style>

    <script>
      (function () {
        try {
          const ls = window.localStorage;
          let lang  = ls.getItem("lang")  || "sk";
          let theme = ls.getItem("theme") || "dark";
          let automatonSlots = ls.getItem("automatonSlots") || "[]";

          document.documentElement.lang = lang;
          document.documentElement.setAttribute("data-theme", theme);

          const metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) {
            metaTheme.setAttribute("content", theme === "dark" ? "#0b0f14" : "#f9fafb");
          }

          window.__APP_FLAGS__ = { lang, theme, automatonSlots };
        } catch (e) {
          window.__APP_FLAGS__ = { lang: "sk", theme: "dark", automatonSlots: "[]" };
        }
      })();
    </script>
  </head>
  <body>
    <script src="main.js"></script>
    <script>
      if (!location.hash) location.hash = "#/";
      const app = Elm.Main.init({ flags: window.__APP_FLAGS__ });

      if (app.ports && app.ports.saveAutomatonSlots) {
        app.ports.saveAutomatonSlots.subscribe(function (payload) {
          try {
            window.localStorage.setItem("automatonSlots", payload);
          } catch (e) {
            // ignore storage write errors
          }
        });
      }

      if (app.ports && app.ports.exportAutomatonFile) {
        app.ports.exportAutomatonFile.subscribe(function (payload) {
          try {
            const content = typeof payload?.content === "string" ? payload.content : "";
            const baseName = typeof payload?.fileName === "string" && payload.fileName.trim() ? payload.fileName.trim() : "automaton";
            const fileName = baseName.endsWith(".fas") ? baseName : `${baseName}.fas`;
            const blob = new Blob([content], { type: "application/octet-stream" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
          } catch (e) {
            // ignore export errors
          }
        });
      }

      if (app.ports && app.ports.importAutomatonFile && app.ports.importAutomatonFileResult) {
        app.ports.importAutomatonFile.subscribe(function (slotId) {
          try {
            const input = document.createElement("input");
            input.type = "file";
            input.accept = ".fas,application/octet-stream";
            input.style.display = "none";
            input.addEventListener("change", function () {
              const file = input.files && input.files[0];
              if (!file) {
                app.ports.importAutomatonFileResult.send({ slotId: -1, content: "" });
                document.body.removeChild(input);
                return;
              }

              const reader = new FileReader();
              reader.onload = function () {
                const content = typeof reader.result === "string" ? reader.result : "";
                app.ports.importAutomatonFileResult.send({ slotId, content });
                document.body.removeChild(input);
              };
              reader.onerror = function () {
                app.ports.importAutomatonFileResult.send({ slotId: -1, content: "" });
                document.body.removeChild(input);
              };
              reader.readAsText(file);
            });
            document.body.appendChild(input);
            input.click();
          } catch (e) {
            app.ports.importAutomatonFileResult.send({ slotId: -1, content: "" });
          }
        });
      }
    </script>
  </body>
</html>
