<!doctype html>
<html lang="sk" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Elm FA SPA</title>
    <link rel="icon" href="icon.png" type="image/x-icon">
    <meta name="theme-color" content="#0b0f14">
    <style>
      :root {
        --bg-dark: #0b0f14;
        --fg-dark: #e5e7eb;

        --bg-light: #f9fafb;
        --fg-light: #111827;
      }

      html[data-theme="dark"] body {
        background-color: var(--bg-dark);
        color: var(--fg-dark);
      }

      html[data-theme="light"] body {
        background-color: var(--bg-light);
        color: var(--fg-light);
      }

      body {
        margin: 0;
        padding: 0;
      }

      .responsive-block {
        margin-top: 40px; /* на компьютере */
      }

      @media (max-width: 768px) {
        .responsive-block {
          margin-top: 20px; /* на телефоне */
        }
      }
    </style>

    <script>
      (function () {
        function supportedLang(value) {
          const normalized = (value || "").toLowerCase();

          if (normalized.startsWith("sk")) return "sk";
          if (normalized.startsWith("ru")) return "ru";
          if (normalized.startsWith("uk") || normalized.startsWith("ua")) return "ua";
          if (normalized.startsWith("en")) return "en";

          return null;
        }

        function normalizeLang(value) {
          return supportedLang(value) || "en";
        }

        const STORAGE_KEYS = {
          lang: "fas.lang",
          theme: "fas.theme",
          automatonSlots: "fas.automatonSlots",
          startPage: "fas.startPage"
        };

        function getStorageValue(ls, primaryKey, legacyKey) {
          return ls.getItem(primaryKey) || ls.getItem(legacyKey);
        }

        function detectBrowserLang() {
          const nav = window.navigator || {};
          const preferred = Array.isArray(nav.languages) && nav.languages.length
            ? nav.languages[0]
            : nav.language;
          return normalizeLang(preferred);
        }

        function resolveInitialLang(ls) {
          if (ls) {
            const stored = getStorageValue(ls, STORAGE_KEYS.lang, "lang");
            const parsedStored = supportedLang(stored);
            if (parsedStored) return parsedStored;
          }

          return detectBrowserLang();
        }

        function resolveInitialTheme(ls) {
          if (ls) {
            const storedTheme = getStorageValue(ls, STORAGE_KEYS.theme, "theme");
            if (storedTheme === "dark" || storedTheme === "light") return storedTheme;
          }

          const prefersDark =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;

          return prefersDark ? "dark" : "light";
        }

        function applyDocumentTheme(theme) {
          document.documentElement.setAttribute("data-theme", theme);

          const metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) {
            metaTheme.setAttribute("content", theme === "dark" ? "#0b0f14" : "#f9fafb");
          }
        }

        try {
          const ls = window.localStorage;
          let lang = resolveInitialLang(ls);
          let theme = resolveInitialTheme(ls);
          let automatonSlots = getStorageValue(ls, STORAGE_KEYS.automatonSlots, "automatonSlots") || "[]";
          let startPageRaw = getStorageValue(ls, STORAGE_KEYS.startPage, "startPage");
          let startPage = Number.parseInt(startPageRaw || "0", 10);
          if (![0, 1, 2, 3].includes(startPage)) startPage = 0;

          document.documentElement.lang = lang;
          applyDocumentTheme(theme);

          window.__APP_FLAGS__ = { lang, theme, automatonSlots, startPage };
        } catch (e) {
          const lang = resolveInitialLang(null);
          const theme = resolveInitialTheme(null);
          document.documentElement.lang = lang;
          applyDocumentTheme(theme);
          window.__APP_FLAGS__ = { lang, theme, automatonSlots: "[]", startPage: 0 };
        }
      })();
    </script>
  </head>
  <body>
    <script src="main.js"></script>
    <script>
      const STORAGE_KEYS = {
        lang: "fas.lang",
        theme: "fas.theme",
        automatonSlots: "fas.automatonSlots",
        startPage: "fas.startPage"
      };

      function supportedLang(value) {
        const normalized = (value || "").toLowerCase();

        if (normalized.startsWith("sk")) return "sk";
        if (normalized.startsWith("ru")) return "ru";
        if (normalized.startsWith("uk") || normalized.startsWith("ua")) return "ua";
        if (normalized.startsWith("en")) return "en";

        return null;
      }

      function normalizeLang(value) {
        return supportedLang(value) || "en";
      }

      function applyDocumentTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);

        const metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) {
          metaTheme.setAttribute("content", theme === "dark" ? "#0b0f14" : "#f9fafb");
        }
      }

      if (!location.hash) location.hash = "#/";
      const app = Elm.Main.init({ flags: window.__APP_FLAGS__ });

      (function setupWhatsNewChecks() {
        const VERSION_URL = "version.json";
        const CHANGELOG_URL = "changelog.json";
        const LAST_SEEN_VERSION_KEY = "fas.lastSeenVersion";
        const LAST_CHECK_TS_KEY = "fas.lastVersionCheckAt";
        const RELOAD_ATTEMPT_KEY = "fas.lastReloadAttemptVersion";
        const CHECK_ON_FOCUS_AFTER_MS = 5 * 60 * 1000;
        const FALLBACK_INTERVAL_MS = 45 * 60 * 1000;

        function resolveUiLang() {
          const langFromDoc = String(document.documentElement.lang || "").toLowerCase();
          if (langFromDoc.startsWith("ru")) return "ru";
          if (langFromDoc.startsWith("uk") || langFromDoc.startsWith("ua")) return "ua";
          if (langFromDoc.startsWith("sk")) return "sk";
          return "en";
        }

        function parseVersion(version) {
          const clean = String(version || "").trim().replace(/^v/i, "");
          if (!clean) return [];
          return clean.split(".").map((part) => {
            const parsed = Number.parseInt(part, 10);
            return Number.isFinite(parsed) ? parsed : 0;
          });
        }

        function compareVersions(a, b) {
          const left = parseVersion(a);
          const right = parseVersion(b);
          const maxLength = Math.max(left.length, right.length);
          for (let i = 0; i < maxLength; i++) {
            const l = left[i] || 0;
            const r = right[i] || 0;
            if (l > r) return 1;
            if (l < r) return -1;
          }
          return 0;
        }

        function isGreaterVersion(a, b) {
          return compareVersions(a, b) > 0;
        }

        async function fetchJsonNoCache(url) {
          const response = await fetch(`${url}?v=${Date.now()}`, { cache: "no-store" });
          if (!response.ok) throw new Error(`Failed to fetch ${url}: ${response.status}`);
          return response.json();
        }

        function getStorageValue(key, fallback) {
          try {
            return window.localStorage.getItem(key) || fallback;
          } catch (error) {
            return fallback;
          }
        }

        function setStorageValue(key, value) {
          try {
            window.localStorage.setItem(key, value);
          } catch (error) {
            // ignore storage write errors
          }
        }

        function filterChangelogEntries(entries, lastSeenVersion, remoteVersion) {
          if (!Array.isArray(entries)) return [];
          return entries
            .filter((entry) => entry && typeof entry.version === "string")
            .filter((entry) => isGreaterVersion(entry.version, lastSeenVersion))
            .filter((entry) => compareVersions(entry.version, remoteVersion) <= 0)
            .sort((a, b) => compareVersions(b.version, a.version));
        }

        function getLocalizedEntryTitle(entry, lang) {
          if (!entry) return "";
          if (typeof entry.title === "string" && entry.title.trim()) return entry.title;
          if (entry.title && typeof entry.title === "object") {
            return entry.title[lang] || entry.title.en || entry.title.ru || "";
          }
          return "";
        }

        function getLocalizedEntryItems(entry, lang) {
          if (!entry) return [];
          if (Array.isArray(entry.items)) return entry.items;
          if (entry.items && typeof entry.items === "object") {
            const localized = entry.items[lang] || entry.items.en || entry.items.ru || [];
            return Array.isArray(localized) ? localized : [];
          }
          return [];
        }

        function notifyElmAboutWhatsNew(remoteVersion, changelogEntries, showReloadWarning) {
          if (!(app.ports && app.ports.whatsNewDetected)) return;
          const lang = resolveUiLang();
          const localizedEntries = changelogEntries.map((entry) => ({
            version: String(entry.version || ""),
            title: getLocalizedEntryTitle(entry, lang),
            items: getLocalizedEntryItems(entry, lang)
          }));

          app.ports.whatsNewDetected.send({
            version: remoteVersion,
            entries: localizedEntries,
            showReloadWarning: showReloadWarning
          });
        }

        async function checkForUpdates() {
          const now = Date.now();
          setStorageValue(LAST_CHECK_TS_KEY, String(now));

          try {
            const versionPayload = await fetchJsonNoCache(VERSION_URL);
            const remoteVersion = String(versionPayload && versionPayload.version ? versionPayload.version : "").trim();
            if (!remoteVersion) return;

            const lastSeenVersion = getStorageValue(LAST_SEEN_VERSION_KEY, "0.0.0");
            const isFirstVisitWithWelcome = Boolean(window.__APP_FLAGS__ && window.__APP_FLAGS__.startPage === 0);

            if (isFirstVisitWithWelcome) {
              setStorageValue(LAST_SEEN_VERSION_KEY, remoteVersion);
              return;
            }

            if (!isGreaterVersion(remoteVersion, lastSeenVersion)) return;

            const reloadAttemptedFor = getStorageValue(RELOAD_ATTEMPT_KEY, "");
            if (reloadAttemptedFor !== remoteVersion) {
              setStorageValue(RELOAD_ATTEMPT_KEY, remoteVersion);
              window.location.reload();
              return;
            }

            const changelogPayload = await fetchJsonNoCache(CHANGELOG_URL);
            const entries = Array.isArray(changelogPayload) ? changelogPayload : changelogPayload.entries;
            const changelogEntries = filterChangelogEntries(entries, lastSeenVersion, remoteVersion);
            notifyElmAboutWhatsNew(remoteVersion, changelogEntries, true);
          } catch (error) {
            // ignore failed background update checks
          }
        }

        function maybeCheckForUpdates() {
          const lastCheckedRaw = getStorageValue(LAST_CHECK_TS_KEY, "0");
          const lastCheckedAt = Number.parseInt(lastCheckedRaw, 10) || 0;
          if (Date.now() - lastCheckedAt > CHECK_ON_FOCUS_AFTER_MS) {
            checkForUpdates();
          }
        }

        checkForUpdates();
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") maybeCheckForUpdates();
        });
        window.addEventListener("focus", maybeCheckForUpdates);
        window.setInterval(checkForUpdates, FALLBACK_INTERVAL_MS);
      })();
      
      if (app.ports && app.ports.saveAutomatonSlots) {
        app.ports.saveAutomatonSlots.subscribe(function (payload) {
          try {
            window.localStorage.setItem("automatonSlots", payload);
            window.localStorage.setItem(STORAGE_KEYS.automatonSlots, payload);
          } catch (e) {
            // ignore storage write errors
          }
        });
      }

      if (app.ports && app.ports.saveLang) {
        app.ports.saveLang.subscribe(function (payload) {
          try {
            const lang = (payload || "").toLowerCase() || "en";
            window.localStorage.setItem("lang", lang);
            window.localStorage.setItem(STORAGE_KEYS.lang, lang);
            document.documentElement.lang = lang;
          } catch (e) {
            // ignore storage write errors
          }
        });
      }

      if (app.ports && app.ports.saveTheme) {
        app.ports.saveTheme.subscribe(function (payload) {
          try {
            const theme = payload === "light" ? "light" : "dark";
            window.localStorage.setItem("theme", theme);
            window.localStorage.setItem(STORAGE_KEYS.theme, theme);
            applyDocumentTheme(theme)
          } catch (e) {
            // ignore storage write errors
          }
        });
      }

      if (app.ports && app.ports.saveStartPage) {
        app.ports.saveStartPage.subscribe(function (payload) {
          try {
            const raw = Number.parseInt(String(payload), 10);
            const startPage = [0, 1, 2, 3].includes(raw) ? raw : 0;
            window.localStorage.setItem("startPage", String(startPage));
            window.localStorage.setItem(STORAGE_KEYS.startPage, String(startPage));
          } catch (e) {
            // ignore storage write errors
          }
        });
      }


      (function attachRuntimePreferencePersistence() {
        const THEME_TOGGLE_LABELS = new Set([
          "Light", "Dark", "Светлая", "Тёмная", "Темна", "Світла", "Svetlá", "Tmavá"
        ]);

        document.addEventListener("change", function (event) {
          const target = event.target;
          if (!(target instanceof HTMLSelectElement)) return;

          const values = Array.from(target.options).map((o) => o.value.toLowerCase());
          const isLangSelect = ["sk", "en", "ru", "ua"].every((value) => values.includes(value));
          if (!isLangSelect) return;

          const lang = normalizeLang(target.value);
          try {
            window.localStorage.setItem("lang", lang);
            window.localStorage.setItem(STORAGE_KEYS.lang, lang);
          } catch (e) {
            // ignore storage write errors
          }
          document.documentElement.lang = lang;
        });

        document.addEventListener("click", function (event) {
          const target = event.target;
          if (!(target instanceof HTMLElement)) return;

          const button = target.closest("button");
          if (!(button instanceof HTMLButtonElement)) return;

          const label = (button.textContent || "").trim();
          if (!THEME_TOGGLE_LABELS.has(label)) return;

          const currentTheme =
            window.localStorage.getItem(STORAGE_KEYS.theme) ||
            window.localStorage.getItem("theme") ||
            (document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark");
          const nextTheme = currentTheme === "dark" ? "light" : "dark";

          try {
            window.localStorage.setItem("theme", nextTheme);
            window.localStorage.setItem(STORAGE_KEYS.theme, nextTheme);
          } catch (e) {
            // ignore storage write errors
          }

          applyDocumentTheme(nextTheme);
        });
      })();
      
      if (app.ports && app.ports.exportAutomatonFile) {
        app.ports.exportAutomatonFile.subscribe(function (payload) {
          try {
            const content = typeof payload?.content === "string" ? payload.content : "";
            const baseName = typeof payload?.fileName === "string" && payload.fileName.trim() ? payload.fileName.trim() : "automaton";
            const fileName = baseName.endsWith(".fas") ? baseName : `${baseName}.fas`;
            const blob = new Blob([content], { type: "application/octet-stream" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
          } catch (e) {
            // ignore export errors
          }
        });
      }

      if (app.ports && app.ports.importAutomatonFile && app.ports.importAutomatonFileResult) {
        app.ports.importAutomatonFile.subscribe(function (slotId) {
          try {
            const input = document.createElement("input");
            input.type = "file";
            input.accept = ".fas,application/octet-stream";
            input.style.display = "none";
            input.addEventListener("change", function () {
              const file = input.files && input.files[0];
              if (!file) {
                app.ports.importAutomatonFileResult.send({ slotId: -1, content: "" });
                document.body.removeChild(input);
                return;
              }

              const reader = new FileReader();
              reader.onload = function () {
                const content = typeof reader.result === "string" ? reader.result : "";
                app.ports.importAutomatonFileResult.send({ slotId, content });
                document.body.removeChild(input);
              };
              reader.onerror = function () {
                app.ports.importAutomatonFileResult.send({ slotId: -1, content: "" });
                document.body.removeChild(input);
              };
              reader.readAsText(file);
            });
            document.body.appendChild(input);
            input.click();
          } catch (e) {
            app.ports.importAutomatonFileResult.send({ slotId: -1, content: "" });
          }
        });
      }
    </script>
  </body>
</html>
